const state = {
  quick:new Set(), view:'list', selectedId:null, favorites:new Set(), compare:new Set(),
  quickPrice:{min:null,max:null}, quickArea:{min:null,max:null},
  adv:{priceMin:null,priceMax:null,areaMin:null,areaMax:null,types:[],risks:[],docs:false,auction:false,road:'any',power:'any',water:'any'},

  deepTab:'data', history:[]
};

const fmtRub = n => new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const riskOrder = {low:0,med:1,high:2};
const riskText = {low:'low',med:'med',high:'high'};
const soilColors = {high:'#86efac',med:'#fcd34d',low:'#fca5a5'};
let map, schemeLayer, satLayer, parcelLayer, poiLayer, infraLayer, waterLayer, restrictionsLayer;
const layerById = {};

function initMap(){
  map = L.map('map',{zoomControl:true}).setView([52.95,36.2],8);
  schemeLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'});
  satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri'});
  schemeLayer.addTo(map);

  parcelLayer = L.geoJSON(parcels,{style:styleParcel,onEachFeature:(f,l)=>{layerById[f.properties.id]=l;l.on('click',()=>selectLot(f.properties.id,true));}}).addTo(map);
  poiLayer = L.geoJSON(poiLayerData,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,color:'#6d28d9',fillColor:'#8b5cf6',fillOpacity:0.9}).bindTooltip(f.properties.name)});
  infraLayer = L.geoJSON(infraLinesData,{style:{color:'#7c3aed',weight:3,dashArray:'8,6'}});
  waterLayer = L.geoJSON(waterData,{style:{color:'#06b6d4',weight:3,fillColor:'#67e8f9',fillOpacity:0.25}});
  restrictionsLayer = L.geoJSON(restrictionsData,{style:{color:'#ef4444',weight:2,fillColor:'#f87171',fillOpacity:0.20,dashArray:'4,4'}});
}

function styleParcel(feature){
  const lot = lots.find(x=>x.id===feature.properties.id);
  const selected = state.selectedId===lot.id;
  const fill = state.layers.soil ? soilColors[lot.soilScore] : '#c4b5fd';
  const opacity = state.layers.relief ? 0.88 : 0.72;
  return {color: state.layers.cadastre ? (selected?'#6d28d9':'#4338ca') : 'transparent', weight:selected?4:2, fillColor:fill, fillOpacity:opacity, dashArray: state.layers.relief ? '5,5' : null};
}

function applyLayerToggles(){
  parcelLayer.setStyle(styleParcel);
  state.layers.infra ? (map.addLayer(poiLayer),map.addLayer(infraLayer)) : (map.removeLayer(poiLayer),map.removeLayer(infraLayer));
  state.layers.water ? map.addLayer(waterLayer) : map.removeLayer(waterLayer);
  state.layers.restrictions ? map.addLayer(restrictionsLayer) : map.removeLayer(restrictionsLayer);
}

function getFilteredLots(){
  const res = lots.filter(l=>{
    if (state.quick.has('type') && l.landType!=='пашня') return false;
    if (state.quick.has('docs') && !l.hasDocs) return false;
    if (state.quick.has('riskLow') && l.riskLevel!=='low') return false;
    if (state.quick.has('auction') && !l.isAuction) return false;
    if (state.quick.has('road') && l.distanceToRoadKm>2) return false;
    if (state.quick.has('power') && l.distanceToPowerKm>10) return false;
    if (state.quick.has('water') && l.distanceToWaterKm>3) return false;

    if (state.quickPrice.min && l.priceRub<state.quickPrice.min) return false;
    if (state.quickPrice.max && l.priceRub>state.quickPrice.max) return false;
    if (state.quickArea.min && l.areaHa<state.quickArea.min) return false;
    if (state.quickArea.max && l.areaHa>state.quickArea.max) return false;

    const a=state.adv;
    if (a.priceMin && l.priceRub<a.priceMin) return false;
    if (a.priceMax && l.priceRub>a.priceMax) return false;
    if (a.areaMin && l.areaHa<a.areaMin) return false;
    if (a.areaMax && l.areaHa>a.areaMax) return false;
    if (a.types.length && !a.types.includes(l.landType)) return false;
    if (a.risks.length && !a.risks.includes(l.riskLevel)) return false;
    if (a.docs && !l.hasDocs) return false;
    if (a.auction && !l.isAuction) return false;
    if (a.road!=='any' && l.distanceToRoadKm>=Number(a.road)) return false;
    if (a.power!=='any' && l.distanceToPowerKm>=Number(a.power)) return false;
    if (a.water!=='any' && l.distanceToWaterKm>=Number(a.water)) return false;
    return true;
  });
  const sort=document.getElementById('sortSelect').value;
  if(sort==='price')res.sort((a,b)=>a.priceRub-b.priceRub);
  if(sort==='area')res.sort((a,b)=>b.areaHa-a.areaHa);
  if(sort==='risk')res.sort((a,b)=>riskOrder[a.riskLevel]-riskOrder[b.riskLevel]);
  return res;
}

function updateMapVisibility(){
  const ids = new Set(getFilteredLots().map(l=>l.id));
  Object.entries(layerById).forEach(([id,layer])=>{
    if(ids.has(Number(id))) { if(!map.hasLayer(layer)) layer.addTo(map); }
    else if(map.hasLayer(layer)) map.removeLayer(layer);

  parcelLayer.setStyle(styleParcel);
  if (state.selectedId && !ids.has(state.selectedId)) clearSelection();

function scoreOf(l){
  let s=50;
  if(l.riskLevel==='low')s+=18; if(l.riskLevel==='high')s-=18;
  if(l.hasDocs)s+=8; else s-=7;
  if(l.soilScore==='high')s+=12; if(l.soilScore==='low')s-=10;
  s += Math.max(-10,Math.min(10, Math.round((-l.marketDeltaPct)/2)));
  s += l.distanceToRoadKm<=2?6:(l.distanceToRoadKm>5?-5:0);
  s -= l.unusedSignal?8:0;
  return Math.max(0,Math.min(100,s));
}

function statusBadge(v){
  const c=v==='OK'?'status-ok':v==='PARTIAL'?'status-partial':'status-unknown';
  return `<span class="text-[10px] px-2 py-0.5 rounded-full ${c}">${v}</span>`;
}

  const mini=[['Legal Risk',100-(lot.riskLevel==='high'?65:lot.riskLevel==='med'?45:20)],['Deal Complexity',lot.hasDocs?78:52],['Agro Suitability',lot.agroPotential==='high'?88:lot.agroPotential==='med'?66:41],['Liquidity',Math.max(35,85+lot.marketDeltaPct)]];
  deepScore.innerHTML = `

function runDeepCheck(){

  const loading=document.getElementById('deepLoading'),content=document.getElementById('deepContent'),bar=document.getElementById('deepBar');

  setTimeout(()=>bar.style.width='38%',700); setTimeout(()=>bar.style.width='69%',1500);
  setTimeout(()=>{bar.style.width='100%'; loading.classList.add('hidden'); content.classList.remove('hidden'); renderDeep(lot);},2400);
}

function refresh(){ renderQuickChips(); renderLots(); updateMapVisibility(); applyLayerToggles(); updateHistory(); }

document.addEventListener('click',(e)=>{
  const chip=e.target.closest('[data-chip]');
  if(chip){
    const key=chip.dataset.chip;
    if(key==='price'||key==='area'){ document.getElementById(`pop-${key}`).classList.toggle('hidden'); return; }
    state.quick.has(key)?state.quick.delete(key):state.quick.add(key); refresh(); return;
  }

  const popApply=e.target.closest('[data-pop-apply]');
  if(popApply){
    const k=popApply.dataset.popApply;
    if(k==='price'){state.quickPrice.min=Number(document.getElementById('price-min').value)||null;state.quickPrice.max=Number(document.getElementById('price-max').value)||null;}
    if(k==='area'){state.quickArea.min=Number(document.getElementById('area-min').value)||null;state.quickArea.max=Number(document.getElementById('area-max').value)||null;}
    state.quick.add(k); document.getElementById(`pop-${k}`).classList.add('hidden'); refresh(); return;
  }

  if(e.target.id==='openFilters'){openDrawer(true);return;}
  if(e.target.id==='closeDrawer'){openDrawer(false);return;}
  if(e.target.id==='overlay'){openDrawer(false);openDeep(false);return;}
  if(e.target.id==='applyFilters'){
    state.adv={priceMin:Number(fPriceMin.value)||null,priceMax:Number(fPriceMax.value)||null,areaMin:Number(fAreaMin.value)||null,areaMax:Number(fAreaMax.value)||null,
      types:[...document.querySelectorAll('.fType:checked')].map(i=>i.value),risks:[...document.querySelectorAll('.fRisk:checked')].map(i=>i.value),docs:fDocs.checked,auction:fAuction.checked,road:fRoad.value,power:fPower.value,water:fWater.value};
    openDrawer(false); refresh(); return;
  }
  if(e.target.id==='resetFilters'){
    ['fPriceMin','fPriceMax','fAreaMin','fAreaMax'].forEach(id=>document.getElementById(id).value='');
    document.querySelectorAll('.fType,.fRisk').forEach(i=>i.checked=false); fDocs.checked=fAuction.checked=false; fRoad.value=fPower.value=fWater.value='any';
    state.adv={priceMin:null,priceMax:null,areaMin:null,areaMax:null,types:[],risks:[],docs:false,auction:false,road:'any',power:'any',water:'any'}; refresh(); return;
  }

  const lotCard=e.target.closest('.lot-card'); if(lotCard){ selectLot(Number(lotCard.dataset.id)); return; }
  const action=e.target.closest('.card-action'); if(action){
    const id=Number(action.dataset.id);
    if(action.dataset.action==='fav') state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);
    if(action.dataset.action==='cmp') state.compare.has(id)?state.compare.delete(id):state.compare.add(id);
    renderLots(); return;
  }

  const viewBtn=e.target.closest('.view-btn'); if(viewBtn){
    state.view=viewBtn.dataset.view;
    document.querySelectorAll('.view-btn').forEach(b=>{const on=b.dataset.view===state.view;b.classList.toggle('bg-white',on);b.classList.toggle('shadow',on);b.classList.toggle('text-slate-600',!on);});
    renderLots(); return;
  }

  const base=e.target.closest('.basemap-btn'); if(base){
    const mode=base.dataset.basemap;
    if(mode==='scheme'){map.removeLayer(satLayer);map.addLayer(schemeLayer);} else {map.removeLayer(schemeLayer);map.addLayer(satLayer);}
    document.querySelectorAll('.basemap-btn').forEach(b=>{const on=b.dataset.basemap===mode;b.classList.toggle('bg-white',on);b.classList.toggle('shadow',on);b.classList.toggle('text-slate-600',!on);});
    return;
  }

  if(e.target.id==='layersBtn'){layersPopover.classList.toggle('hidden');return;}
  if(!e.target.closest('#layersPopover')) layersPopover.classList.add('hidden');

  if(e.target.classList.contains('layer-toggle')){ state.layers[e.target.dataset.layer]=e.target.checked; applyLayerToggles(); parcelLayer.setStyle(styleParcel); return; }

  if(e.target.id==='clearSelection'){clearSelection();return;}
  if(e.target.id==='openDeepCheck'){runDeepCheck();return;}
  if(e.target.id==='closeDeep'){openDeep(false);return;}

  const tab=e.target.closest('[data-deep-tab]'); if(tab){
    state.deepTab=tab.dataset.deepTab;
    document.querySelectorAll('.deep-tab').forEach(b=>{const on=b.dataset.deepTab===state.deepTab;b.classList.toggle('bg-white',on);b.classList.toggle('shadow',on);b.classList.toggle('text-slate-600',!on);});
    deepDataTab.classList.toggle('hidden',state.deepTab!=='data'); deepScoreTab.classList.toggle('hidden',state.deepTab!=='score'); return;
  }

  if(e.target.id==='downloadDeep'){
    const lot=lots.find(x=>x.id===state.selectedId); const text=`AgroZver DeepCheck\nID: ${lot.id}\nРайон: ${lot.district}\nScore: ${scoreOf(lot)}\nДата: ${new Date().toLocaleString('ru-RU')}`;
    const blob=new Blob([text],{type:'text/plain'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`AgroZver_DeepCheck_${lot.id}.txt`; a.click(); URL.revokeObjectURL(url); return;
  }
  if(e.target.id==='saveDeep'){
    const lot=lots.find(x=>x.id===state.selectedId); state.history.push({id:lot.id,district:lot.district,time:new Date().toLocaleTimeString('ru-RU'),score:scoreOf(lot)}); updateHistory(); return;
  }

  const mtab=e.target.closest('.mobile-tab'); if(mtab){
    const mode=mtab.dataset.mobileTab;
    document.querySelectorAll('.mobile-tab').forEach(b=>{const on=b.dataset.mobileTab===mode;b.classList.toggle('bg-primary-600',on);b.classList.toggle('text-white',on);b.classList.toggle('bg-white',!on);b.classList.toggle('border',!on);b.classList.toggle('border-slate-300',!on);});
    mapPane.classList.toggle('hidden',mode!=='map'); listPane.classList.toggle('hidden',mode!=='list');
    setTimeout(()=>map.invalidateSize(),80);
  }
});

document.getElementById('sortSelect').addEventListener('change',refresh);
window.addEventListener('resize',()=>map && map.invalidateSize());

initMap();
renderLayersPopover();
refresh();
</script>
</body>
</html>
