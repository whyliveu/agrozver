function activeLots() {
  let res = lots.filter(l => {
    if (state.quick.has('price') && l.priceRub > 12000000) return false;
    if (state.quick.has('area') && l.areaHa < 55) return false;
    if (state.quick.has('type') && l.landType !== 'пашня') return false;
    if (state.quick.has('docs') && !l.hasDocs) return false;
    if (state.quick.has('risk') && l.riskLevel !== 'low') return false;
    if (state.quick.has('auction') && !l.isAuction) return false;
    if (state.quick.has('road') && l.distanceToRoadKm > 5) return false;
    if (state.quick.has('power') && l.distanceToPowerKm > 10) return false;

    const a = state.advanced;
    if (a.priceMin && l.priceRub < a.priceMin) return false;
    if (a.priceMax && l.priceRub > a.priceMax) return false;
    if (a.areaMin && l.areaHa < a.areaMin) return false;
    if (a.areaMax && l.areaHa > a.areaMax) return false;
    if (a.types.length && !a.types.includes(l.landType)) return false;
    if (a.risks.length && !a.risks.includes(l.riskLevel)) return false;
    if (a.docs && !l.hasDocs) return false;
    if (a.auction && !l.isAuction) return false;
    if (a.road !== 'any' && l.distanceToRoadKm >= Number(a.road)) return false;
    if (a.power !== 'any' && l.distanceToPowerKm >= Number(a.power)) return false;
    return true;
  });
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'price') res.sort((a,b)=>a.priceRub-b.priceRub);
  if (sort === 'area') res.sort((a,b)=>b.areaHa-a.areaHa);
  if (sort === 'risk') res.sort((a,b)=>riskOrder[a.riskLevel]-riskOrder[b.riskLevel]);
  return res;
}

function renderQuickChips(){
  const row = document.getElementById('quickChips');
  row.innerHTML = quickChipDefs.map(c=>{
    const on = state.quick.has(c.key);
    return `<button data-chip="${c.key}" class="chip whitespace-nowrap px-3 py-1.5 rounded-full text-sm border ${on?'bg-primary-600 text-white border-primary-600':'bg-white border-slate-300 hover:bg-primary-50'}">${c.label}</button>`;
  }).join('') + '<button id="openFiltersTop" class="ml-auto whitespace-nowrap px-3 py-1.5 rounded-full text-sm border border-primary-300 text-primary-700 bg-primary-50">Фильтры</button>';
}

function renderLayers(){
  const list = document.getElementById('layersList');
  list.innerHTML = layerDefs.map(l=>`
    <label class="flex items-center justify-between rounded-lg px-2 py-1.5 hover:bg-slate-50">
      <span class="text-sm">${l.label}${l.dev?'<span class="ml-1 text-[10px] text-slate-400">в разработке</span>':''}</span>
      <input data-layer="${l.key}" type="checkbox" class="layer-check rounded" ${state.layer[l.key]?'checked':''}>
    </label>
  `).join('');
}

function renderMap(){
  const ids = new Set(activeLots().map(x=>x.id));
  polygonsEl.innerHTML = lots.map(l=>{
    if (!ids.has(l.id)) return '';
    const selected = state.selectedId === l.id;
    const fill = state.layer.soil ? soilFill[l.soilScore] : '#c4b5fd';
    const opacity = state.mapTheme === 'sat' ? 0.68 : 0.78;
    const relief = state.layer.relief ? 'url(#reliefPattern)' : fill;
    return `<polygon data-id="${l.id}" points="${l.polygon.map(p=>p.join(',')).join(' ')}" fill="${relief}" fill-opacity="${opacity}" stroke="${state.layer.cadastre ? (selected?'#6d28d9':'#4338ca') : 'transparent'}" stroke-width="${selected?4:2}" class="map-poly cursor-pointer transition-all" />`;
  }).join('');

  const pGroup = document.getElementById('infraPoints');
  const lGroup = document.getElementById('infraLines');
  pGroup.classList.toggle('hidden', !state.layer.infra);
  lGroup.classList.toggle('hidden', !state.layer.infra);
  pGroup.innerHTML = poi.map(p=>`<g><circle cx="${p.x}" cy="${p.y}" r="6" fill="#7c3aed" /><text x="${p.x+9}" y="${p.y+4}" font-size="11" fill="#111827">${p.label}</text></g>`).join('');
  lGroup.innerHTML = infraLines.map(line=>`<polyline points="${line.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#7c3aed" stroke-dasharray="8 6" stroke-width="2"/>`).join('');
}

function card(l, idx){
  const selected = state.selectedId===l.id;
  const fav = state.favorites.has(l.id);
  const cmp = state.compare.has(l.id);
  return `<article data-id="${l.id}" class="lot-card cursor-pointer border rounded-xl p-3 ${selected?'border-primary-500 ring-2 ring-primary-100 bg-primary-50/40':'border-slate-200 hover:border-primary-300'}">
    <div class="${state.view==='grid'?'':'sm:flex sm:gap-3'}">
      <div class="${state.view==='grid'?'h-28 mb-3':'sm:w-36 sm:h-24 h-28 mb-3 sm:mb-0'} rounded-lg ${previewColor[idx%previewColor.length]} grid place-content-center text-xs text-slate-500">preview</div>
      <div class="flex-1 min-w-0">
        <h3 class="font-semibold text-sm sm:text-base">${l.title}</h3>
        <p class="font-bold text-lg">${fmt(l.priceRub)}</p>
        <p class="text-sm text-slate-600">${fmt(l.pricePerHaRub)}/га • ${l.areaHa} га</p>
        <p class="text-xs text-slate-500">${l.district} р-н • ${l.vri}</p>
        <div class="mt-2 flex flex-wrap gap-1.5">
          ${l.riskLevel==='low'?'<span class="badge">Низкий риск</span>':''}
          ${l.hasDocs?'<span class="badge">Документы</span>':''}
          ${l.isAuction?'<span class="badge">Торги</span>':''}
        </div>
        <p class="text-xs mt-2">Агропотенциал: <b>${l.agroPotential}</b> • Риск: <b>${riskText[l.riskLevel]}</b></p>
      </div>
    </div>
    <div class="mt-3 pt-2 border-t border-slate-200 flex gap-2 items-center">
      <button data-action="fav" data-id="${l.id}" class="act px-2.5 py-1.5 rounded-lg border text-xs ${fav?'bg-primary-100 border-primary-400 text-primary-700':'border-slate-300'}">${fav?'♥ В избранном':'♡ Избранное'}</button>
      <button data-action="cmp" data-id="${l.id}" class="act px-2.5 py-1.5 rounded-lg border text-xs ${cmp?'bg-primary-100 border-primary-400 text-primary-700':'border-slate-300'}">${cmp?'✓ Сравнить':'Сравнить'}</button>
      <a href="#" class="ml-auto text-xs text-primary-700">Подробнее</a>
    </div>
  </article>`;
}

function renderList(){
  const filtered = activeLots();
  foundCount.textContent = `Найдено: ${filtered.length}`;
  lotsWrap.className = state.view==='grid' ? 'p-3 overflow-auto grid grid-cols-1 xl:grid-cols-2 gap-3' : 'p-3 overflow-auto space-y-3';
  lotsWrap.innerHTML = filtered.map(card).join('') || '<div class="text-sm text-slate-500 p-4 text-center">Ничего не найдено</div>';
  if (state.selectedId && !filtered.some(x=>x.id===state.selectedId)) {
    state.selectedId = null;
    document.getElementById('mapHint').classList.add('hidden');
  }
}

function showMini(){
  const lot = lots.find(l=>l.id===state.selectedId);
  const box = document.getElementById('mapHint');
  if (!lot) return box.classList.add('hidden');
  document.getElementById('miniTitle').textContent = `Участок #${lot.id} — ${lot.district}`;
  document.getElementById('miniMeta').textContent = `${fmt(lot.priceRub)} • ${lot.areaHa} га • риск: ${riskText[lot.riskLevel]}`;
  box.classList.remove('hidden');
}

function renderHistory(){
  historyList.innerHTML = state.history.length
    ? state.history.slice(-5).reverse().map(x=>`<li>• #${x.id} (${x.score}) — ${x.date}</li>`).join('')
    : '<li>Пока пусто</li>';
}

function refresh(){
  renderQuickChips();
  renderList();
  renderMap();
  showMini();
  renderHistory();
}

function openDrawer(open=true){
  const overlay = document.getElementById('overlay');
  const drawer = document.getElementById('filterDrawer');
  overlay.classList.toggle('hidden', !open);
  if (window.innerWidth >= 768) {
    drawer.classList.toggle('md:translate-x-full', !open);
    drawer.classList.toggle('md:translate-x-0', open);
  } else {
    drawer.classList.toggle('translate-y-full', !open);
    drawer.classList.toggle('translate-y-0', open);
  }
}

function openDeep(open=true){
  document.getElementById('deepPanel').classList.toggle('translate-x-full', !open);
  document.getElementById('overlay').classList.toggle('hidden', !open);
}

function deepResultHtml(lot){
  const limits = lot.riskLevel === 'low' ? 'нет' : lot.riskLevel === 'med' ? 'охранная зона ЛЭП' : 'частичное подтопление; санитарная зона';
  const score = lot.riskLevel === 'low' ? 'зелёный' : lot.riskLevel === 'med' ? 'жёлтый' : 'красный';
  const factors = [
    `Почва: ${lot.soilScore}`,
    `До дороги: ${lot.distanceToRoadKm} км`,
    `До подстанции: ${lot.distanceToPowerKm} км`,
    lot.hasDocs ? 'Документы в порядке' : 'Документы требуют проверки',
    lot.unusedSignal ? `Признаки неиспользования: да (${lot.unusedConfidence}%)` : `Признаки неиспользования: нет (${lot.unusedConfidence}%)`
  ];
  return `
  <div class="space-y-2 text-sm">
    <div class="p-3 rounded-lg bg-slate-50 border border-slate-200">
      <p><b>Участок:</b> #${lot.id}, ${lot.district} р-н</p>
      <p><b>Кадастр/категория:</b> ${lot.category}, ${lot.vri}</p>
      <p><b>Ограничения:</b> ${limits}</p>
      <p><b>Торги:</b> ${lot.isAuction?'да':'нет'} ${lot.isAuction?'• <a href="#" class="text-primary-700">ссылка</a>':''}</p>
      <p><b>Признаки неиспользования:</b> ${lot.unusedSignal?'да':'нет'} • confidence ${lot.unusedConfidence}%</p>
      <p><b>Скоринг:</b> ${score}</p>
    </div>
    <div class="p-3 rounded-lg border border-slate-200">
      <p class="font-semibold mb-1">Факторы</p>
      <ul class="list-disc pl-5 space-y-1">${factors.map(f=>`<li>${f}</li>`).join('')}</ul>
    </div>
    <div class="flex gap-2">
      <button id="downloadReport" class="flex-1 rounded-lg bg-primary-600 text-white py-2">Скачать PDF</button>
      <button id="saveHistory" class="flex-1 rounded-lg border border-slate-300 py-2">Сохранить в историю</button>
    </div>
  </div>`;
}

function runDeepCheck(){
  const lot = lots.find(x=>x.id===state.selectedId);
  if (!lot) return;
  openDeep(true);
  const loading = document.getElementById('deepLoading');
  const result = document.getElementById('deepResult');
  const bar = document.getElementById('deepProgress');
  result.classList.add('hidden');
  loading.classList.remove('hidden');
  bar.style.width = '12%';
  setTimeout(()=> bar.style.width='47%', 700);
  setTimeout(()=> bar.style.width='78%', 1500);
  setTimeout(()=>{
    bar.style.width='100%';
    loading.classList.add('hidden');
    result.innerHTML = deepResultHtml(lot);
    result.classList.remove('hidden');
  }, 2500);
}

document.addEventListener('click', (e)=>{
  const chip = e.target.closest('[data-chip]');
  if (chip) {
    const k = chip.dataset.chip;
    state.quick.has(k) ? state.quick.delete(k) : state.quick.add(k);
    refresh();
    return;
  }

  if (e.target.id === 'openFilters' || e.target.id === 'openFiltersTop') { openDrawer(true); return; }
  if (e.target.id === 'closeFilter' || e.target.id === 'overlay') { openDrawer(false); openDeep(false); return; }

  if (e.target.id === 'applyFilter') {
    state.advanced = {
      priceMin: Number(document.getElementById('fPriceMin').value) || null,
      priceMax: Number(document.getElementById('fPriceMax').value) || null,
      areaMin: Number(document.getElementById('fAreaMin').value) || null,
      areaMax: Number(document.getElementById('fAreaMax').value) || null,
      types: [...document.querySelectorAll('.fType:checked')].map(i=>i.value),
      risks: [...document.querySelectorAll('.fRisk:checked')].map(i=>i.value),
      docs: document.getElementById('fDocs').checked,
      auction: document.getElementById('fAuction').checked,
      road: document.getElementById('fRoad').value,
      power: document.getElementById('fPower').value
    };
    openDrawer(false);
    refresh();
    return;
  }

  if (e.target.id === 'resetFilter') {
    ['fPriceMin','fPriceMax','fAreaMin','fAreaMax'].forEach(id=>document.getElementById(id).value='');
    document.querySelectorAll('.fType,.fRisk').forEach(i=>i.checked=false);
    document.getElementById('fDocs').checked = false;
    document.getElementById('fAuction').checked = false;
    document.getElementById('fRoad').value = 'any';
    document.getElementById('fPower').value = 'any';
    state.advanced = {priceMin:null,priceMax:null,areaMin:null,areaMax:null,types:[],risks:[],docs:false,auction:false,road:'any',power:'any'};
    refresh();
    return;
  }

  const poly = e.target.closest('.map-poly');
  if (poly) { state.selectedId = Number(poly.dataset.id); refresh(); return; }

  const lotCard = e.target.closest('.lot-card');
  if (lotCard) { state.selectedId = Number(lotCard.dataset.id); refresh(); return; }

  const act = e.target.closest('.act');
  if (act) {
    const id = Number(act.dataset.id);
    if (act.dataset.action === 'fav') state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);
    if (act.dataset.action === 'cmp') state.compare.has(id)?state.compare.delete(id):state.compare.add(id);
    refresh();
    return;
  }

  const view = e.target.closest('.view-btn');
  if (view) {
    state.view = view.dataset.view;
    document.querySelectorAll('.view-btn').forEach(btn=>{
      const active = btn.dataset.view === state.view;
      btn.classList.toggle('bg-white', active); btn.classList.toggle('shadow', active); btn.classList.toggle('text-slate-600', !active);
    });
    renderList();
    return;
  }

  const mapTheme = e.target.closest('.map-theme');
  if (mapTheme) {
    state.mapTheme = mapTheme.dataset.mapTheme;
    document.querySelectorAll('.map-theme').forEach(btn=>{
      const on = btn.dataset.mapTheme===state.mapTheme;
      btn.classList.toggle('bg-white', on); btn.classList.toggle('shadow', on); btn.classList.toggle('text-slate-600', !on);
    });
    document.getElementById('mapBg').className = state.mapTheme === 'scheme'
      ? 'relative flex-1 bg-gradient-to-br from-slate-100 to-slate-200 p-2'
      : 'relative flex-1 bg-gradient-to-br from-slate-600 via-slate-700 to-slate-800 p-2';
    renderMap();
    return;
  }

  if (e.target.id === 'layersBtn') { document.getElementById('layersMenu').classList.toggle('hidden'); return; }
  if (!e.target.closest('#layersMenu')) document.getElementById('layersMenu').classList.add('hidden');

  if (e.target.classList.contains('layer-check')) {
    state.layer[e.target.dataset.layer] = e.target.checked;
    renderMap();
    return;
  }

  if (e.target.id === 'deepCheckBtn') { runDeepCheck(); return; }
  if (e.target.id === 'closeDeep') { openDeep(false); return; }

  if (e.target.id === 'downloadReport') {
    const lot = lots.find(x=>x.id===state.selectedId);
    const text = `Deep Check\nУчасток #${lot.id}\nРайон: ${lot.district}\nРиск: ${riskText[lot.riskLevel]}\nСгенерировано: ${new Date().toLocaleString('ru-RU')}`;
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `deep-check-${lot.id}.pdf.txt`; a.click();
    URL.revokeObjectURL(url);
    return;
  }

  if (e.target.id === 'saveHistory') {
    const lot = lots.find(x=>x.id===state.selectedId);
    const score = lot.riskLevel === 'low' ? 'зелёный' : lot.riskLevel === 'med' ? 'жёлтый' : 'красный';
    state.history.push({id:lot.id,score,date:new Date().toLocaleTimeString('ru-RU')});
    renderHistory();
    return;
  }

  const mtab = e.target.closest('.mobile-tab');
  if (mtab) {
    const tab = mtab.dataset.mobileTab;
    document.querySelectorAll('.mobile-tab').forEach(btn=>{
      const on = btn.dataset.mobileTab === tab;
      btn.classList.toggle('bg-primary-600', on); btn.classList.toggle('text-white', on); btn.classList.toggle('bg-white', !on); btn.classList.toggle('border', !on); btn.classList.toggle('border-slate-300', !on);
    });
    document.getElementById('mapPane').classList.toggle('hidden', tab !== 'map');
    document.getElementById('listPane').classList.toggle('hidden', tab !== 'list');
  }
});

document.getElementById('sortSelect').addEventListener('change', refresh);

refresh();
renderLayers();
</script>
<style>.badge{font-size:11px;padding:.12rem .45rem;border-radius:999px;background:#ede9fe;border:1px solid #c4b5fd;color:#5b21b6}</style>
</body>
</html>
