<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroZver — Карта + каталог</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95'
              }
            },
            boxShadow: {
              soft: '0 8px 24px rgba(76, 29, 149, 0.08)'
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen">
    <div class="min-h-screen flex flex-col">
      <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3">
          <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-9 h-9 rounded-xl bg-primary-600 text-white flex items-center justify-center shadow-soft font-bold">A</div>
              <div class="font-semibold text-lg tracking-tight">AgroZver</div>
            </div>

            <div class="flex-1 lg:max-w-2xl">
              <label class="relative block">
                <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">🔎</span>
                <input
                  type="text"
                  placeholder="Регион / район / кадастровый номер / адрес"
                  class="w-full rounded-xl border border-slate-300 bg-white py-2.5 pl-10 pr-4 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
                />
              </label>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 overflow-x-auto pb-1 lg:pb-0">
              <button class="px-3 py-2 text-sm rounded-lg bg-primary-600 text-white hover:bg-primary-700 transition">Разместить</button>
              <button class="px-3 py-2 text-sm rounded-lg border border-slate-300 hover:border-primary-300 hover:bg-primary-50 transition">Избранное</button>
              <button class="px-3 py-2 text-sm rounded-lg border border-slate-300 hover:border-primary-300 hover:bg-primary-50 transition">Войти</button>
              <span class="ml-1 px-2.5 py-1 text-xs rounded-full bg-primary-100 text-primary-800 border border-primary-200">Free</span>
            </div>
          </div>
        </div>
      </header>

      <div class="max-w-7xl mx-auto w-full px-3 sm:px-4 pt-3 pb-4">
        <div class="flex items-center gap-2 overflow-x-auto pb-1" id="chipRow"></div>
      </div>

      <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 pb-6">
        <div class="md:hidden mb-3 space-y-2">
          <button id="openFiltersMobile" class="w-full rounded-xl border border-primary-300 bg-white text-primary-700 px-4 py-2.5 text-sm font-medium">Фильтры</button>
          <div class="bg-white p-1 rounded-xl shadow-soft border border-slate-200 inline-flex w-full">
            <button data-mobile-tab="map" class="mobile-tab-btn flex-1 rounded-lg py-2 text-sm bg-primary-600 text-white">Карта</button>
            <button data-mobile-tab="list" class="mobile-tab-btn flex-1 rounded-lg py-2 text-sm text-slate-600">Список</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 min-h-[74vh]">
          <section id="mapSection" class="bg-white rounded-2xl border border-slate-200 shadow-soft overflow-hidden flex flex-col">
            <div class="p-3 border-b border-slate-200 flex flex-wrap items-center gap-2">
              <div class="inline-flex bg-slate-100 p-1 rounded-lg">
                <button class="px-3 py-1 text-xs rounded-md bg-white shadow text-slate-700">Схема</button>
                <button class="px-3 py-1 text-xs rounded-md text-slate-600">Спутник</button>
              </div>
              <button class="px-3 py-1.5 text-xs rounded-lg border border-slate-300 hover:border-primary-300 hover:bg-primary-50">Рисовать область</button>
              <button class="px-3 py-1.5 text-xs rounded-lg border border-slate-300 hover:border-primary-300 hover:bg-primary-50">Измерить</button>
              <button class="px-3 py-1.5 text-xs rounded-lg border border-slate-300 hover:border-primary-300 hover:bg-primary-50">Моя точка</button>

              <div class="relative ml-auto">
                <button id="layersBtn" class="px-3 py-1.5 text-xs rounded-lg border border-slate-300 hover:border-primary-300 hover:bg-primary-50">Слои ▾</button>
                <div id="layersPopover" class="hidden absolute right-0 mt-2 w-60 rounded-xl border border-slate-200 bg-white shadow-soft p-3 z-30">
                  <p class="text-xs uppercase tracking-wide text-slate-500 mb-2">Слои карты</p>
                  <div class="space-y-2" id="layersList"></div>
                </div>
              </div>
            </div>

            <div class="flex-1 bg-slate-200 relative grid place-items-center text-center p-6">
              <div>
                <p class="text-slate-500 text-sm">Заглушка карты</p>
                <p id="selectedLotLabel" class="mt-2 font-medium text-slate-700">Выбран участок: не выбран</p>
              </div>
            </div>
          </section>

          <section id="catalogSection" class="bg-white rounded-2xl border border-slate-200 shadow-soft overflow-hidden flex flex-col">
            <div class="p-3 border-b border-slate-200 flex flex-wrap gap-2 items-center">
              <div id="foundCount" class="font-medium text-sm">Найдено: 128</div>
              <select id="sortSelect" class="ml-auto rounded-lg border border-slate-300 px-2.5 py-1.5 text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-100 outline-none">
                <option value="relevance">Релевантности</option>
                <option value="price">Цене</option>
                <option value="area">Площади</option>
                <option value="risk">Риску</option>
              </select>
              <div class="inline-flex bg-slate-100 p-1 rounded-lg">
                <button data-view="list" class="view-btn px-2.5 py-1 text-xs rounded-md bg-white shadow">Список</button>
                <button data-view="grid" class="view-btn px-2.5 py-1 text-xs rounded-md text-slate-600">Плитка</button>
              </div>
              <button id="openFiltersDesktop" class="hidden md:inline-flex px-3 py-1.5 text-xs rounded-lg border border-primary-300 text-primary-700 bg-primary-50">Фильтры</button>
            </div>

            <div id="lotsContainer" class="p-3 space-y-3 overflow-auto"></div>
            <div class="p-3 border-t border-slate-200">
              <button class="w-full rounded-xl bg-primary-600 text-white py-2.5 text-sm font-medium hover:bg-primary-700 transition">Показать ещё</button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="drawerOverlay" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
    <aside id="filtersDrawer" class="fixed z-50 bg-white shadow-2xl border-slate-200 transition-transform duration-300 ease-out md:top-0 md:right-0 md:h-full md:w-[380px] md:border-l md:translate-x-full bottom-0 left-0 right-0 h-[85vh] rounded-t-2xl border-t translate-y-full md:rounded-none">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <h2 class="font-semibold">Фильтры</h2>
        <button id="closeDrawer" class="text-slate-500 hover:text-slate-700">✕</button>
      </div>
      <div class="p-4 overflow-auto h-[calc(100%-140px)] space-y-4 text-sm">
        <label class="block">
          <span class="text-slate-600">Регион</span>
          <select class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
            <option>Любой</option>
            <option>Краснодарский край</option>
            <option>Ростовская область</option>
            <option>Ставропольский край</option>
          </select>
        </label>

        <div class="grid grid-cols-2 gap-2">
          <label class="block"><span class="text-slate-600">Цена от</span><input type="number" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" /></label>
          <label class="block"><span class="text-slate-600">Цена до</span><input type="number" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" /></label>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <label class="block"><span class="text-slate-600">Площадь от</span><input type="number" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" /></label>
          <label class="block"><span class="text-slate-600">Площадь до</span><input type="number" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" /></label>
        </div>

        <label class="block"><span class="text-slate-600">Тип</span><select class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"><option>Любой</option><option>Пашня</option><option>Сад</option><option>Сенокос</option></select></label>
        <label class="block"><span class="text-slate-600">Пригодность почвы</span><select class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"><option>Любая</option><option>Высокая</option><option>Средняя</option><option>Низкая</option></select></label>
        <label class="block"><span class="text-slate-600">Уклон</span><select class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"><option>Любой</option><option>0–3°</option><option>3–7°</option><option>7°+</option></select></label>
        <label class="block"><span class="text-slate-600">До дороги</span><select class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"><option>Любое</option><option>до 1 км</option><option>до 5 км</option><option>5+ км</option></select></label>
        <label class="block"><span class="text-slate-600">До ЛЭП</span><select class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"><option>Любое</option><option>до 500 м</option><option>до 2 км</option><option>2+ км</option></select></label>

        <label class="flex items-center gap-2 pt-1">
          <input type="checkbox" class="rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
          <span>скрыть с ограничениями</span>
        </label>
      </div>
      <div class="absolute bottom-0 inset-x-0 p-4 border-t border-slate-200 bg-white flex gap-2">
        <button class="flex-1 rounded-lg border border-slate-300 py-2 hover:bg-slate-100">Сбросить</button>
        <button id="applyFilters" class="flex-1 rounded-lg bg-primary-600 text-white py-2 hover:bg-primary-700">Применить</button>
      </div>
    </aside>

    <script>
      const chips = ['Цена', 'Площадь', 'Тип', 'Документы', 'Риск', 'Дорога', 'Электричество', 'Вода'];
      const layers = ['Кадастр', 'Почвы', 'Климат', 'Рельеф', 'Вода', 'Инфраструктура', 'Ограничения', 'Логистика'];
      const lots = [
        { id: 1, title: 'Пашня у трассы М4', price: 12800000, area: 42, region: 'Ростовская обл., Азовский р-н', risk: 'Низкий', agro: 'высокий', pricePerHa: 304761, badges: ['Низкий риск', 'Документы', 'Торг'] },
        { id: 2, title: 'Участок у реки', price: 9600000, area: 28, region: 'Краснодарский край, Тимашевский р-н', risk: 'Средний', agro: 'высокий', pricePerHa: 342857, badges: ['Документы', 'Торг'] },
        { id: 3, title: 'Садовый массив', price: 7400000, area: 18, region: 'Ставропольский край, Кочубеевский р-н', risk: 'Низкий', agro: 'средний', pricePerHa: 411111, badges: ['Низкий риск', 'Документы'] },
        { id: 4, title: 'Пастбище на южном склоне', price: 5300000, area: 31, region: 'Волгоградская обл., Городищенский р-н', risk: 'Высокий', agro: 'средний', pricePerHa: 170968, badges: ['Торг'] },
        { id: 5, title: 'Пашня рядом с ЛЭП', price: 15400000, area: 55, region: 'Курская обл., Курчатовский р-н', risk: 'Низкий', agro: 'высокий', pricePerHa: 280000, badges: ['Низкий риск', 'Документы'] },
        { id: 6, title: 'Сенокос с доступом к воде', price: 6900000, area: 26, region: 'Белгородская обл., Яковлевский р-н', risk: 'Средний', agro: 'средний', pricePerHa: 265384, badges: ['Документы', 'Торг'] },
        { id: 7, title: 'Земля под виноградники', price: 17300000, area: 37, region: 'Краснодарский край, Анапский р-н', risk: 'Низкий', agro: 'высокий', pricePerHa: 467567, badges: ['Низкий риск', 'Документы'] },
        { id: 8, title: 'Резервный агроучасток', price: 4500000, area: 22, region: 'Воронежская обл., Хохольский р-н', risk: 'Средний', agro: 'низкий', pricePerHa: 204545, badges: ['Торг'] }
      ];

      const state = {
        activeChips: new Set(),
        favorites: new Set(),
        compare: new Set(),
        view: 'list',
        selectedLot: null
      };

      const chipRow = document.getElementById('chipRow');
      const lotsContainer = document.getElementById('lotsContainer');
      const selectedLotLabel = document.getElementById('selectedLotLabel');
      const sortSelect = document.getElementById('sortSelect');

      function formatRub(value) {
        return new Intl.NumberFormat('ru-RU').format(value) + ' ₽';
      }

      function chipButton(label) {
        const active = state.activeChips.has(label);
        return `<button data-chip="${label}" class="chip whitespace-nowrap px-3 py-1.5 text-sm rounded-full border transition ${active ? 'bg-primary-600 text-white border-primary-600' : 'bg-white border-slate-300 text-slate-700 hover:border-primary-300 hover:bg-primary-50'}">${label}</button>`;
      }

      function renderChips() {
        chipRow.innerHTML = `${chips.map(chipButton).join('')}<button id="openFiltersChips" class="ml-auto whitespace-nowrap px-3 py-1.5 text-sm rounded-full border border-primary-300 text-primary-700 bg-primary-50">Фильтры</button>`;
      }

      function lotCard(lot) {
        const isGrid = state.view === 'grid';
        const selected = state.selectedLot === lot.id;
        const fav = state.favorites.has(lot.id);
        const cmp = state.compare.has(lot.id);
        const riskTone = lot.risk === 'Низкий' ? 'text-emerald-700' : lot.risk === 'Средний' ? 'text-amber-700' : 'text-rose-700';
        return `
          <article data-id="${lot.id}" class="lot-card cursor-pointer border rounded-xl p-3 transition hover:border-primary-300 ${selected ? 'border-primary-500 ring-2 ring-primary-100 bg-primary-50/40' : 'border-slate-200'} ${isGrid ? '' : ''}">
            <div class="${isGrid ? '' : 'sm:flex sm:gap-3'}">
              <div class="${isGrid ? 'w-full h-28 mb-3' : 'sm:w-36 sm:h-24 h-28 mb-3 sm:mb-0'} rounded-lg bg-slate-200 grid place-items-center text-slate-500 text-xs">превью</div>
              <div class="flex-1 min-w-0">
                <h3 class="font-semibold text-sm sm:text-base truncate">${lot.title}</h3>
                <p class="mt-1 text-lg font-bold text-slate-900">${formatRub(lot.price)}</p>
                <p class="text-sm text-slate-600">${formatRub(lot.pricePerHa)}/га · ${lot.area} га</p>
                <p class="text-xs text-slate-500 mt-0.5">${lot.region}</p>

                <div class="mt-2 flex flex-wrap gap-1.5">
                  ${lot.badges.map(b => `<span class="px-2 py-0.5 text-[11px] rounded-full bg-primary-100 text-primary-800 border border-primary-200">${b}</span>`).join('')}
                </div>

                <div class="mt-2 text-xs space-y-0.5">
                  <p>Агропотенциал: <span class="font-medium">${lot.agro}</span></p>
                  <p>Риск: <span class="font-medium ${riskTone}">${lot.risk}</span></p>
                </div>
              </div>
            </div>

            <div class="mt-3 pt-2 border-t border-slate-200 flex items-center gap-2">
              <button data-action="fav" data-id="${lot.id}" class="action-btn px-2.5 py-1.5 text-xs rounded-lg border ${fav ? 'border-primary-500 bg-primary-100 text-primary-800' : 'border-slate-300 hover:border-primary-300'}">${fav ? '♥ В избранном' : '♡ Избранное'}</button>
              <button data-action="cmp" data-id="${lot.id}" class="action-btn px-2.5 py-1.5 text-xs rounded-lg border ${cmp ? 'border-primary-500 bg-primary-100 text-primary-800' : 'border-slate-300 hover:border-primary-300'}">${cmp ? '✓ Сравнить' : '+ Сравнить'}</button>
              <a href="#" class="ml-auto text-xs text-primary-700 hover:text-primary-900">Подробнее</a>
            </div>
          </article>`;
      }

      function getSortedLots() {
        const copy = [...lots];
        const key = sortSelect.value;
        if (key === 'price') copy.sort((a, b) => a.price - b.price);
        if (key === 'area') copy.sort((a, b) => b.area - a.area);
        if (key === 'risk') {
          const order = { 'Низкий': 0, 'Средний': 1, 'Высокий': 2 };
          copy.sort((a, b) => order[a.risk] - order[b.risk]);
        }
        return copy;
      }

      function renderLots() {
        lotsContainer.className = state.view === 'grid'
          ? 'p-3 overflow-auto grid grid-cols-1 sm:grid-cols-2 gap-3'
          : 'p-3 overflow-auto space-y-3';
        lotsContainer.innerHTML = getSortedLots().map(lotCard).join('');
      }

      function renderLayers() {
        const list = document.getElementById('layersList');
        list.innerHTML = layers.map(layer => `
          <label class="flex items-center justify-between rounded-lg px-2 py-1.5 hover:bg-slate-50">
            <span class="text-sm">${layer}</span>
            <input type="checkbox" class="rounded border-slate-300 text-primary-600 focus:ring-primary-500" ${['Кадастр', 'Почвы'].includes(layer) ? 'checked' : ''}>
          </label>
        `).join('');
      }

      function setSelectedLot(id) {
        const lot = lots.find(l => l.id === id);
        state.selectedLot = id;
        selectedLotLabel.textContent = `Выбран участок: ${lot.title}`;
        renderLots();
      }

      function toggleDrawer(open) {
        const drawer = document.getElementById('filtersDrawer');
        const overlay = document.getElementById('drawerOverlay');
        overlay.classList.toggle('hidden', !open);
        if (window.innerWidth >= 768) {
          drawer.classList.toggle('md:translate-x-full', !open);
          drawer.classList.toggle('md:translate-x-0', open);
        } else {
          drawer.classList.toggle('translate-y-full', !open);
          drawer.classList.toggle('translate-y-0', open);
        }
      }

      document.addEventListener('click', (e) => {
        const chip = e.target.closest('[data-chip]');
        if (chip) {
          const name = chip.dataset.chip;
          state.activeChips.has(name) ? state.activeChips.delete(name) : state.activeChips.add(name);
          renderChips();
          return;
        }

        const actionBtn = e.target.closest('.action-btn');
        if (actionBtn) {
          e.stopPropagation();
          const id = Number(actionBtn.dataset.id);
          if (actionBtn.dataset.action === 'fav') {
            state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
          }
          if (actionBtn.dataset.action === 'cmp') {
            state.compare.has(id) ? state.compare.delete(id) : state.compare.add(id);
          }
          renderLots();
          return;
        }

        const lot = e.target.closest('.lot-card');
        if (lot) {
          setSelectedLot(Number(lot.dataset.id));
          return;
        }

        if (e.target.id === 'openFiltersDesktop' || e.target.id === 'openFiltersMobile' || e.target.id === 'openFiltersChips') {
          toggleDrawer(true);
          return;
        }

        if (e.target.id === 'closeDrawer' || e.target.id === 'drawerOverlay' || e.target.id === 'applyFilters') {
          toggleDrawer(false);
          return;
        }

        const viewBtn = e.target.closest('.view-btn');
        if (viewBtn) {
          state.view = viewBtn.dataset.view;
          document.querySelectorAll('.view-btn').forEach(btn => {
            btn.classList.toggle('bg-white', btn.dataset.view === state.view);
            btn.classList.toggle('shadow', btn.dataset.view === state.view);
            btn.classList.toggle('text-slate-600', btn.dataset.view !== state.view);
          });
          renderLots();
          return;
        }

        if (e.target.id === 'layersBtn') {
          document.getElementById('layersPopover').classList.toggle('hidden');
        } else if (!e.target.closest('#layersPopover')) {
          document.getElementById('layersPopover').classList.add('hidden');
        }

        const mobileTab = e.target.closest('.mobile-tab-btn');
        if (mobileTab) {
          const mode = mobileTab.dataset.mobileTab;
          const mapSection = document.getElementById('mapSection');
          const catalogSection = document.getElementById('catalogSection');
          document.querySelectorAll('.mobile-tab-btn').forEach(btn => {
            const active = btn.dataset.mobileTab === mode;
            btn.classList.toggle('bg-primary-600', active);
            btn.classList.toggle('text-white', active);
            btn.classList.toggle('text-slate-600', !active);
          });
          mapSection.classList.toggle('hidden', mode !== 'map');
          catalogSection.classList.toggle('hidden', mode !== 'list');
        }
      });

      sortSelect.addEventListener('change', renderLots);
      window.addEventListener('resize', () => toggleDrawer(false));

      renderChips();
      renderLayers();
      renderLots();
    </script>
  </body>
</html>
